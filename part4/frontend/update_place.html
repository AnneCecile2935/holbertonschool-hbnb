<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Place</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Home</a>
      <img src="images/logo.png" alt="App logo" class="logo">
      <a href="login.html" class="login-button" id="login-button">Login</a>
      <a href="#" class="logout-button" id="logout-button" style="display: none;">Logout</a>
    </nav>
  </header>
  <main>
    <form id="edit-place-form">
      <h2>Edit Place</h2>
      <label for="title">Title:</label>
      <input type="text" id="title" name="title" required>

      <label for="description">Description:</label>
      <textarea id="description" name="description" required></textarea>

      <label for="price">Price:</label>
      <input type="number" id="price" name="price" required>

      <button type="submit">Enregistrer</button>
    </form>
  </main>
  <footer>
    <p>All rights reserved</p>
  </footer>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/edit-place.js"></script>
</body>
</html>
